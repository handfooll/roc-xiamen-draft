# __DOMAIN__ is replaced by setup.sh
# IPv6 visitors are limited per /64, otherwise one visitor could rotate addresses
map $remote_addr $rate_key {
    "~^(?<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" $v6;
    default $remote_addr;
}
limit_req_zone $rate_key zone=lead:10m rate=6r/m;
limit_req_zone $rate_key zone=admin:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 8k;
    root /var/www/rea/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # every location that sets headers must include the security headers again (nginx does not inherit them)
    location = /index.html { include snippets/rea-headers.conf; add_header Cache-Control "no-cache" always; }
    location / { include snippets/rea-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
    location ~* "\.[0-9a-f]{10}\.(css|js)$" { include snippets/rea-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location ~* \.(png|svg|ico|txt)$ { include snippets/rea-headers.conf; add_header Cache-Control "public, max-age=86400" always; }

    error_page 404 /404.html;
    location = /404.html { include snippets/rea-headers.conf; internal; }

    location = /api/health {
        include snippets/rea-headers.conf;
        access_log off;
        proxy_pass http://127.0.0.1:8081;
    }

    location = /api/lead {
        include snippets/rea-headers.conf;
        limit_except POST { deny all; }
        limit_req zone=lead burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:8081;
    }

    location /admin {
        include snippets/rea-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=admin burst=10 nodelay;
        auth_basic "Leads";
        auth_basic_user_file /etc/nginx/rea.htpasswd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8081;
    }

    location ~ /\. { deny all; }
}
