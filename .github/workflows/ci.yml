name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s server -v
      - run: node build.mjs
      - run: scripts/check.sh
      - run: shellcheck deploy/*.sh scripts/*.sh
      - run: deploy/check-nginx.sh
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  preview:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  deploy:
    needs: test
    # runs only after the server exists: set repo variable DEPLOY_HOST and secrets DEPLOY_KEY, DEPLOY_KNOWN_HOSTS
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-22.04
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: API=/api/lead LANG_MAIN=${{ vars.LANG_MAIN || 'ru' }} node build.mjs
      - name: ssh key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: upload and switch
        env:
          HOST: deploy@${{ vars.DEPLOY_HOST }}
          REL: /var/www/rea/releases/${{ github.sha }}
        run: |
          rsync -az --delete dist/ "$HOST:$REL/"
          rsync -az --delete --exclude '__pycache__' --exclude 'test_*' server/ "$HOST:/opt/rea/server/"
          ssh "$HOST" "ln -sfn $REL /var/www/rea/current.new && mv -T /var/www/rea/current.new /var/www/rea/current \
            && sudo /usr/bin/systemctl restart rea-lead \
            && cd /var/www/rea/releases && ls -1t | tail -n +6 | xargs -r rm -rf"
      - name: smoke test
        run: |
          curl -fsS https://${{ vars.DEPLOY_HOST_DOMAIN || vars.DEPLOY_HOST }}/ | grep -q '<h1'
